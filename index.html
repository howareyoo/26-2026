<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>26 — 일정 정하기</title>
<meta property="og:title" content="26 · 2차">
<meta property="og:description" content="서울 1박 2일, 칸마다 골라서 일정 조립하기">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F5F5F7;
  --card:#FFFFFF;
  --label:#1D1D1F;
  --secondary:#6E6E73;
  --sep:rgba(60,60,67,.16);
  --fill:#E8E8ED;
  --seg-on:#FFFFFF;
  --accent:#0071E3;
  --green:#34C759;
  --red:#FF3B30;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#000000;
    --card:#1C1C1E;
    --label:#F5F5F7;
    --secondary:#98989D;
    --sep:rgba(84,84,88,.55);
    --fill:#2C2C2E;
    --seg-on:#636366;
    --accent:#0A84FF;
    --green:#30D158;
    --red:#FF453A;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--font);color:var(--label);background:var(--bg);
  -webkit-font-smoothing:antialiased;line-height:1.47;letter-spacing:-0.01em;
}
#app{max-width:520px;margin:0 auto;padding:20px 20px 130px;min-height:100vh}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-0.025em}
h2{font-size:1.75rem;line-height:1.2}
h3{font-size:1.15rem}
p{margin:0}
.sub{color:var(--secondary);font-size:.97rem;margin-top:6px}
.demo{font-size:.8rem;color:var(--secondary);text-align:center;padding:6px;margin-bottom:8px}

/* 히어로 */
.hero{padding:9vh 4px 28px}
.hero .num{
  font-size:clamp(8rem, 42vw, 12rem);font-weight:800;line-height:.85;letter-spacing:-0.07em;
  animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
}
.hero .cls{font-size:1.35rem;font-weight:600;margin-top:18px}
.hero .what{font-size:1.35rem;font-weight:600;color:var(--secondary)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* 그룹 리스트 (iOS inset grouped) */
.group{background:var(--card);border-radius:14px;overflow:hidden;margin:18px 0}
.group-title{font-size:.82rem;color:var(--secondary);margin:24px 16px -10px}
.row{
  all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;
  min-height:52px;padding:11px 16px;position:relative;cursor:default;
}
button.row{cursor:pointer}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.row .main{flex:1;min-width:0}
.row .t{font-size:1.02rem}
.row .d{font-size:.84rem;color:var(--secondary);margin-top:1px}
.row .val{color:var(--secondary);font-size:.97rem}
.row .check{width:20px;flex:none;color:var(--accent);font-weight:700;font-size:1.05rem;text-align:center;opacity:0}
.row[aria-pressed="true"] .check{opacity:1}
button.row:active{background:var(--fill)}

/* 입력 */
.field{background:var(--card);border-radius:14px;margin:18px 0;padding:4px 16px}
.field input,.field textarea{
  width:100%;border:none;outline:none;background:transparent;color:var(--label);
  font:inherit;font-size:1.05rem;padding:12px 0;resize:none;
}
.field textarea{min-height:88px}
.field+.field{margin-top:10px}
.label{font-size:.82rem;color:var(--secondary);margin:24px 16px 0}

/* 캐릭터 */
.chars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:12px 0}
.char{
  all:unset;cursor:pointer;aspect-ratio:1;border-radius:50%;background:var(--card);
  display:grid;place-items:center;font-size:1.6rem;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s
}
.char[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--accent)}

/* 세그먼트 */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;flex:none}
.seg button{
  all:unset;cursor:pointer;flex:1;text-align:center;padding:6px 10px;border-radius:7px;font-size:.86rem;font-weight:500;
  transition:background .15s, box-shadow .15s
}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.seg button[aria-pressed="true"][data-val="like"]{color:var(--green);font-weight:600}
.seg button[aria-pressed="true"][data-val="no"]{color:var(--red);font-weight:600}
.seg.wide{width:100%;margin-top:8px}
.seg.wide button{font-size:1.25rem;padding:5px 0}
.rate{display:block;padding:12px 16px}
.rate .t{font-size:1rem}
.scale{display:flex;justify-content:space-between;font-size:.76rem;color:var(--secondary);margin:6px 18px 0}

/* 진행 */
.progress{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 14px;margin:-20px 0 10px}
.progress .bar{height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.progress .cnt{font-size:.8rem;color:var(--secondary);margin-top:8px}

/* 하단 */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  padding:12px 20px calc(14px + env(safe-area-inset-bottom));
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
}
.nav-in{max-width:520px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{all:unset;cursor:pointer;text-align:center;font-weight:600;font-size:1.02rem;border-radius:12px;padding:15px 18px}
.btn.primary{flex:1;background:var(--accent);color:#fff}
.btn.primary[disabled]{opacity:.35;cursor:not-allowed}
.btn.text{color:var(--accent);padding:15px 8px}
.btn:focus-visible,.row:focus-visible,.char:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:.85rem;color:var(--red);min-height:1.2em;margin:8px 16px 0}

/* 완료 */
.done{display:grid;place-items:center;text-align:center;min-height:60vh;gap:18px}
.done svg{width:96px;height:96px}
.done circle{stroke:var(--accent);stroke-width:4;fill:none;stroke-dasharray:283;stroke-dashoffset:283;animation:draw .6s ease-out forwards}
.done path{stroke:var(--accent);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .35s .5s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* 현황 */
.count{font-size:4.5rem;font-weight:800;letter-spacing:-0.05em;line-height:1;margin-top:20px}
.count span{color:var(--secondary);font-weight:600}
.avatars{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px;margin:28px 0 8px}
.av{text-align:center}
.av .c{width:64px;height:64px;margin:0 auto;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:1.9rem}
.av .n{font-size:.88rem;margin-top:6px;font-weight:500;word-break:keep-all}
.av.empty .c{background:transparent;border:1.5px dashed var(--sep);color:var(--secondary);font-size:1.1rem}
.av.empty .n{color:var(--secondary)}

/* 결과 */
.result-top{padding:5vh 0 6px}
.result-top .k{font-size:.85rem;color:var(--secondary);font-weight:600}
.card{background:var(--card);border-radius:18px;padding:18px;margin:14px 0}
.area{padding:8px 0}
.area .top{display:flex;justify-content:space-between;font-weight:600}
.area .meter{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin:6px 0}
.area .meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.area:first-child .meter i{background:var(--green)}
.area .why{font-size:.85rem;color:var(--secondary)}
.plan .where{font-size:.88rem;color:var(--secondary);margin-top:4px}
.plan .day{font-size:.8rem;font-weight:600;color:var(--secondary);margin:16px 0 4px}
.plan ul,.card ul{margin:0;padding-left:18px}
.plan li,.card li{margin:4px 0;font-size:.95rem}
.tag{display:inline-block;font-size:.8rem;font-weight:600;background:var(--fill);border-radius:6px;padding:2px 8px;margin:10px 6px 0 0}
.sealed{text-align:center;padding:16vh 0 0}
.sealed .i{font-size:3rem}

@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}.done circle,.done path{stroke-dashoffset:0}}
/* 2차 추가 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{all:unset;cursor:pointer;padding:9px 14px;border-radius:999px;background:var(--card);font-size:.95rem;font-weight:500;box-shadow:inset 0 0 0 1.5px var(--sep)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none}
.chip.no[aria-pressed="true"]{background:var(--red)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.limit{font-size:.82rem;color:var(--secondary);margin:4px 16px 0}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.who button{all:unset;cursor:pointer;text-align:center;padding:12px 4px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 2px transparent}
.who button[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--accent)}
.who .e{font-size:2rem;line-height:1.2}
.who .n{font-size:.9rem;font-weight:500;margin-top:4px;word-break:keep-all}
.stay{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:12px 16px;margin:18px 0;font-size:.92rem}
.stay b{font-weight:600}

.tl{position:relative;margin:6px 0 0;padding:0}
.tl .day{font-size:.8rem;font-weight:700;color:var(--secondary);margin:20px 0 6px}
.tl .day:first-child{margin-top:0}
.slot{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--sep)}
.slot .k{font-size:.8rem;color:var(--secondary);padding-top:2px}
.slot .v{font-weight:600}
.slot .v .or{color:var(--secondary);font-weight:500}
.slot .note{font-size:.82rem;color:var(--secondary);font-weight:400;margin-top:2px}
.slot .warn{font-size:.82rem;color:var(--red);font-weight:500;margin-top:2px}
.bars{margin-top:4px}
.b{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 0}
.b .bl{font-size:.9rem}
.b .bn{font-size:.85rem;color:var(--secondary);font-variant-numeric:tabular-nums}
.b .bm{grid-column:1/-1;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.b .bm i{display:block;height:100%;background:var(--accent);border-radius:3px}
.b.top .bm i{background:var(--green)}
.b.veto .bl{color:var(--red)}
.b.veto .bm i{background:var(--red)}
details.card summary{cursor:pointer;font-weight:700;font-size:1.05rem;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";float:right;color:var(--secondary);font-weight:500}
details.card[open] summary::after{content:"–"}
.q-sec{margin-top:16px}
.q-sec h4{margin:0 0 2px;font-size:.92rem}
.wish{padding:8px 0;border-top:1px solid var(--sep);font-size:.93rem}
.wish:first-child{border-top:none}
.wish b{font-weight:600;margin-right:6px}
.pair{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-top:1px solid var(--sep)}
.pair:first-of-type{border-top:none}
.pair .who2{font-weight:600}
.pair .sc{font-size:1.25rem;font-weight:700;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.pair .sc small{font-size:.75rem;color:var(--secondary);font-weight:500;margin-left:1px}
.pair .rs{grid-column:1/-1;font-size:.85rem;color:var(--secondary)}
.pair.hot .sc{color:var(--green)}
.pair.cold .sc{color:var(--red)}
.ptitle{font-size:.8rem;font-weight:700;color:var(--secondary);margin:16px 0 0}
.ptitle:first-of-type{margin-top:10px}
.groups{display:grid;gap:10px;margin-top:14px}
.grp{border-radius:14px;background:var(--fill);padding:14px}
.grp .gh{display:flex;justify-content:space-between;align-items:baseline}
.grp .gn{font-weight:700;font-size:1.05rem}
.grp .gs{font-size:.8rem;color:var(--secondary)}
.grp .gm{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.grp .gm span{background:var(--card);border-radius:999px;padding:5px 11px 5px 8px;font-size:.92rem;font-weight:500}
.grp .gc{font-size:.82rem;color:var(--secondary);margin-top:8px}
.seg.split{margin-top:12px;width:100%}
.place{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--sep);color:inherit;text-decoration:none}
.ptitle+.place{border-top:none}
.place .main{flex:1;min-width:0}
.place .pn{font-weight:600}
.place .pm{font-size:.84rem;color:var(--secondary);margin-top:1px}
.place .main{color:inherit;text-decoration:none}
.place .go{font-size:.8rem;font-weight:600;color:var(--accent);margin-left:4px}
.place .pw{font-size:.8rem;color:var(--secondary);margin-top:4px}
a.main:active{opacity:.6}
.like{all:unset;cursor:pointer;flex:none;display:flex;align-items:center;gap:4px;padding:7px 11px;border-radius:999px;
  background:var(--fill);font-size:1rem;filter:grayscale(1);transition:filter .15s}
.like span{font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums;min-width:.6em}
.like[aria-pressed="true"]{filter:none;background:color-mix(in srgb, var(--accent) 16%, var(--card));color:var(--accent)}
.like:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

<script>

/* ================= 문항 ================= */
const Q = {

             opts:['경복궁','미술관·전시','낮맥','골목 산책','북촌·삼청동','수성동 계곡·인왕산','광화문·청계천',

const CHARS = ['🐻','🐰','🦊','🐸','🐱','🐶','🐼','🐧','🐹','🐯','🐥','🦦'];

const STEPS = [
  {title:'누구야', keys:[], who:true},
  {title:'몇 시에 모일까', keys:['meet']},
  {title:'점심 뭐 먹지', sub:'2개까지', keys:['lunch']},
  {title:'하고 싶은 거', sub:'3개까지', keys:['day','cafe']},
  {title:'쉬어 가기', keys:['free','rest']},
  {title:'저녁 1차', sub:'2개까지', keys:['dinner']},
  {title:'그 다음', sub:'3개까지', keys:['after','rounds']},
  {title:'둘째 날', keys:['wake','breakfast','bye']},
  {title:'마지막으로', keys:[], last:true}
];
const SUBS = {
  meet:'', cafe:'카페', free:'자유시간 1~2시간 (각자 하고 싶은 거)', rest:'저녁 전 휴식',
  rounds:'몇 차까지 갈래', wake:'기상', breakfast:'아침', bye:'해산', after:'2차부터 가고 싶은 곳', day:'다 같이 하고 싶은 거'
};

/* ================= 상태 ================= */
const blank = () => ({nickname:'', character:'', meet:'', lunch:[], day:[], cafe:'', free:'', rest:'',
  dinner:[], after:[], rounds:'', wake:'', breakfast:'', bye:'', cantEat:'', must:''});
let A = blank();
let view = 'intro', step = 0;
let DATA = {members:[], answers:[], match:null, places:[], likes:{}};
const ME_KEY = 'plan26_me';
function getMe(){ try { return JSON.parse(localStorage.getItem(ME_KEY)) || null; } catch(_) { return null; } }
function setMe(v){ try { localStorage.setItem(ME_KEY, JSON.stringify(v)); } catch(_) {} }
let ME = getMe();
let split = 'trios';
const demo = !CONFIG.SCRIPT_URL;
const DEMO = {
  members:[['가람','🐻'],['귄카','🦊'],['개굴','🐸'],['ㅉㅉ','🐰'],['무야','🐼'],['벅벅숭','🐯']].map(([n,c])=>({nickname:n,character:c})),
  answers:[

    {nickname:'개굴',character:'🐸',meet:'13시',lunch:['한식','시장 먹거리'],day:['미술관·전시','네컷·사진'],cafe:'한 곳만',free:'Y',rest:'숙소에서 쉬기',dinner:['한식 노포','해산물'],after:['막걸리','와인바'],rounds:'3차',wake:'10시',breakfast:'해장국',bye:'15시',cantEat:'회',must:'낮맥 하고 싶음'},
    {nickname:'ㅉㅉ',character:'🐰',meet:'12시',lunch:['일식','한식'],day:['경복궁','네컷·사진'],cafe:'꼭 가자',free:'Y',rest:'숙소에서 쉬기',dinner:['고기','이자카야'],after:['막걸리','숙소에서'],rounds:'3차',wake:'10시',breakfast:'브런치',bye:'15시',cantEat:'',must:'웨이팅 긴 집은 패스'}
  ]

function tally(k, ans){
  const c = {}; Q[k].opts.forEach(o=>c[o]=0);
  ans.forEach(a=>{ const v=a[k]; (Array.isArray(v)?v:[v]).forEach(x=>{ if (x in c) c[x]++; }); });
  return Q[k].opts.map(o=>({o, n:c[o], veto:vetoers(o, ans)})).sort((a,b)=>b.n-a.n);
}
function vetoers(o, ans){ return ans.filter(a=>(a.never||[]).includes(o)).map(a=>a.nickname); }

// 상위 take개 + 마지막 순위와 동점인 것까지
function topOf(k, ans, take=1){
  const t = tally(k, ans).filter(x=>x.n>0);
  if (!t.length) return {main:[], tie:[], all:t};
  const cut = t[Math.min(take, t.length)-1].n;
  const main = t.filter(x=>x.n>cut);
  const tie = t.filter(x=>x.n===cut);
  return {main, tie, need: take - main.length, all:t};
}
function slotValue(k, ans, take=1){
  const r = topOf(k, ans, take);
  if (!r.all.length) return {html:'—', warn:''};
  const show = o => esc(Q[k].show ? Q[k].show[o] : o);
  let parts = r.main.map(x=>show(x.o));
  if (r.need>0){
    if (r.tie.length <= r.need) parts = parts.concat(r.tie.map(x=>show(x.o)));
    else parts.push(r.tie.map(x=>show(x.o)).join(' <span class="or">또는</span> '));
  }
  const picked = r.main.concat(r.tie);
  const warn = picked.filter(x=>x.veto.length).map(x=>`${show(x.o)} 싫다: ${x.veto.map(esc).join(', ')}`);
  let alt = '';
  if (warn.length){
    const a = r.all.find(x=>!x.veto.length && !picked.includes(x));
    if (a) alt = ` → 대안 ${show(a.o)}`;
  }
  return {html: parts.join(', '), warn: warn.length ? warn.join(' · ') + alt : ''};
}

function timelineHTML(ans){
  const slot = (k, label, take=1, note='') => {
    const v = slotValue(k, ans, take);
    return `<div class="slot"><div class="k">${label}</div><div class="v">${v.html}
      ${note?`<div class="note">${note}</div>`:''}${v.warn?`<div class="warn">${v.warn}</div>`:''}</div></div>`;
  };
  // 자유시간
  const y = ans.filter(a=>a.free==='Y').length, nn = ans.filter(a=>a.free==='N').length;
  const freeRow = y>nn ? `<div class="slot"><div class="k">자유시간</div><div class="v">1~2시간 각자<div class="note">찬성 ${y} · 반대 ${nn}</div></div></div>`
    : y===nn && y>0 ? `<div class="slot"><div class="k">자유시간</div><div class="v">할까 말까 <span class="or">동점</span><div class="note">찬성 ${y} · 반대 ${nn}</div></div></div>` : '';
  // 카페
  const cafeTop = topOf('cafe', ans).all[0];
  const cafeRow = cafeTop && cafeTop.o==='패스' ? '' : slot('cafe','카페');
  // 차수
  const rn = ans.map(a=>ROUND_N[a.rounds]||2);
  let main = 2;
  for (let k=2;k<=5;k++) if (rn.filter(x=>x>=k).length*2 > rn.length) main = k;
  const extra = [];
  for (let k=main+1;k<=5;k++){ const c = rn.filter(x=>x>=k).length; if (c) extra.push(`${k===5?'끝까지':k+'차 가능'} ${c}명`); }
  const chain = tally('after', ans).filter(x=>x.n>0);
  const chainTxt = [];
  for (let i=0;i<main-1;i++) chainTxt.push(`${i+2}차 ${chain[i] ? esc(chain[i].o) : '자유'}`);
  const afterWarn = chain.slice(0, main-1).filter(x=>x.veto.length).map(x=>`${esc(x.o)} 싫다: ${x.veto.map(esc).join(', ')}`).join(' · ');
  const afterRow = `<div class="slot"><div class="k">2차 이후</div><div class="v">${chainTxt.join(' → ')}
    <div class="note">본 일정 ${main}차까지${extra.length ? ` · 옵션 ${extra.join(', ')}` : ''}</div>
    ${afterWarn?`<div class="warn">${afterWarn}</div>`:''}</div></div>`;
  const bf = topOf('breakfast', ans).all[0];

  return `<div class="tl">
    <div class="day">DAY 1</div>
    ${slot('meet','집결')}
    ${slot('lunch','점심')}
    ${slot('day','하고 싶은 거',2)}
    ${cafeRow}
    ${freeRow}
    ${slot('rest','휴식',1,'숙소가 가까워서 짐 두고 쉬기 가능')}
    ${slot('dinner','저녁 1차')}
    ${afterRow}
    <div class="day">DAY 2</div>
    ${slot('wake','기상')}
    ${bf && bf.o==='패스' ? '' : slot('breakfast','아침')}
    ${slot('bye','해산')}
  </div>`;
}

function barsHTML(k, ans){
  const t = tally(k, ans), max = Math.max(1, ...t.map(x=>x.n));
  const show = o => esc(Q[k].show ? Q[k].show[o] : o);
  return `<div class="bars">${t.map((x,i)=>`
    <div class="b ${i===0&&x.n>0?'top':''} ${x.veto.length?'veto':''}">
      <span class="bl">${show(x.o)}${x.veto.length?` · 싫다 ${x.veto.length}`:''}</span><span class="bn">${x.n}</span>
      <span class="bm"><i style="width:${x.n/max*100}%"></i></span></div>`).join('')}</div>`;
}

function matchHTML(n){

  if (!m) return `<div class="card"><h3>케미 리포트</h3><p class="sub">${CONFIG.MEMBERS}명 다 모이면 공개돼요 (${n}/${CONFIG.MEMBERS})</p></div>`;
  const pair = (p, cls) => `<div class="pair ${cls}">
      <span class="who2">${esc(p.ac)} ${esc(p.a)} × ${esc(p.bc)} ${esc(p.b)}</span><span class="sc">${p.score}<small>%</small></span>
      <span class="rs">${(p.why||[]).map(esc).join(' · ') || '은근 비슷'}</span></div>`;
  return `<div class="card"><h3>케미 리포트</h3>
      <div class="ptitle">🤝 텔레파시 통하는 사이</div>${(m.best||[]).map(p=>pair(p,'hot')).join('')}
      ${m.worst ? `<div class="ptitle">⚡ N극과 S극</div>${pair(m.worst,'cold')}` : ''}
    </div>
    <div class="card"><h3>따로 또 같이</h3><p class="sub">혹시 자유시간 한다면, 케미 좋은 사람끼리</p>
      <div class="seg split" role="group" aria-label="나누기">
        <button data-act="split" data-val="trios" aria-pressed="${split==='trios'}">3명씩</button>
        <button data-act="split" data-val="duos" aria-pressed="${split==='duos'}">2명씩</button>
      </div>
      <div class="groups" id="groups">${groupsHTML()}</div>
    </div>`;
}

function groupsHTML(){
  const gs = (DATA.match && DATA.match[split]) || [];
  return gs.map(g=>`<div class="grp">
      <div class="gh"><span class="gn">${esc(g.emoji)} ${esc(g.name)}</span><span class="gs">케미 ${g.score}%</span></div>
      <div class="gm">${g.members.map(x=>`<span>${esc(x.char)} ${esc(x.nick)}</span>`).join('')}</div>
      ${g.common && g.common.length ? `<div class="gc">통하는 거: ${g.common.map(esc).join(', ')}</div>` : ''}
    </div>`).join('');
}

function placesHTML(){
  const ps = DATA.places || [];
  if (!ps.length) return '';
  const cats = [];
  ps.forEach(p=>{ if (!cats.includes(p.cat)) cats.push(p.cat); });
  const cnt = p => (DATA.likes[p.name]||[]).length;
  return `<div class="card" id="places"><h3>${esc(CONFIG.PICK_TITLE)}</h3><p class="sub">아는 집 모아둠. 가고 싶으면 👍</p>
    ${cats.map(c=>`<div class="ptitle">${esc(c)}</div>
      ${ps.map((p,i)=>({p,i})).filter(x=>x.p.cat===c).sort((x,y)=>cnt(y.p)-cnt(x.p) || x.i-y.i).map(({p})=>placeRow(p)).join('')}`).join('')}
    <div class="hint" id="likeHint" style="margin:8px 0 0"></div>
  </div>`;
}

function placeRow(p){
  const who = DATA.likes[p.name] || [];
  const mine = ME && who.includes(ME.nickname);
  const chars = Object.fromEntries((DATA.answers||[]).map(a=>[a.nickname, a.character]));
  const inner = `<div class="pn">${esc(p.name)}${p.link?' <span class="go">지도 ›</span>':''}</div>
    ${p.memo?`<div class="pm">${esc(p.memo)}</div>`:''}
    ${who.length?`<div class="pw">${who.map(n=>`${esc(chars[n]||'')} ${esc(n)}`).join(' · ')}</div>`:''}`;
  return `<div class="place">
    ${p.link ? `<a class="main" href="${esc(p.link)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="main">${inner}</div>`}
    <button class="like" data-act="like" data-place="${esc(p.name)}" aria-pressed="${!!mine}" aria-label="좋아요">👍<span>${who.length||''}</span></button>
  </div>`;
}

function wishesHTML(ans){
  const rows = ans.map(a=>{
    const cant = a.cantEat || [].concat(a.never||[], a.neverEtc?[a.neverEtc]:[]).join(', ');
    if (!cant && !a.must) return '';
    const bits = [];
    if (cant) bits.push(`<span style="color:var(--red)">못 먹음: ${esc(cant)}</span>`);
    if (a.must) bits.push(esc(a.must));
    return `<div class="wish"><b>${esc(a.character||'')} ${esc(a.nickname)}</b>${bits.join(' · ')}</div>`;
  }).filter(Boolean);
  return rows.length ? `<div class="card"><h3 style="margin-bottom:6px">못 먹는 거 · 한마디</h3>${rows.join('')}</div>` : '';
}

/* ================= 헬퍼 ================= */
function stepOk(){
  const s = STEPS[step];
  if (s.who) return !!(A.nickname.trim() && A.character);
  return s.keys.every(k => Q[k].type==='multi' ? A[k].length>0 : !!A[k]);
}
function setNav(html){ $navIn.innerHTML = html; $nav.hidden = !html; }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function refreshNext(){
  const b = $navIn.querySelector('[data-act="next"]'); if (b) b.disabled = !stepOk();
  const h = document.getElementById('hint'); if (h) h.textContent = '';
}

/* ================= API ================= */
async function load(){
  if (demo){ await new Promise(r=>setTimeout(r,250)); DATA = {members:DEMO.members, answers:DEMO.answers, match: DEMO.answers.length>=CONFIG.MEMBERS ? DEMO.match : null, places:DEMO.places, likes:DEMO.likes}; return; }
  const res = await fetch(`${CONFIG.SCRIPT_URL}?action=round2`);
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '불러오기 실패');
  DATA = {members:j.members||[], answers:j.answers||[], match:j.match||null, places:j.places||[], likes:j.likes||{}};
}
async function submit(){
  const body = {...A, round:2, nickname:A.nickname.trim(), submittedAt:new Date().toISOString()};
  if (demo){
    await new Promise(r=>setTimeout(r,300));
    const i = DEMO.answers.findIndex(a=>a.nickname===body.nickname);
    if (i>=0) DEMO.answers[i]=body; else DEMO.answers.push(body);
    return;
  }
  const res = await fetch(CONFIG.SCRIPT_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '저장 실패');
}

/* ================= 이벤트 ================= */
document.addEventListener('click', async e=>{
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;

  if (act==='start'){
    view='form'; step=0; render(); return;
  }
  if (act==='go-result'){ view='result'; render(); return; }
  if (act==='back'){ if (step===0) view='intro'; else step--; render(); return; }

  if (act==='next'){
    if (!stepOk()){ document.getElementById('hint').textContent='골라주세요'; return; }
    if (step < STEPS.length-1){ step++; render(); return; }
    el.disabled = true; el.textContent = '보내는 중';
    try { await submit(); ME = {nickname:A.nickname.trim(), character:A.character}; setMe(ME); view='done'; render(); }
    catch(err){ el.disabled=false; el.textContent='제출'; document.getElementById('hint').textContent=`저장 실패: ${err.message}`; }
    return;
  }

  if (act==='char'){
    A.character = el.dataset.val;
    el.parentElement.querySelectorAll('.char').forEach(b=>b.setAttribute('aria-pressed', b===el));
    refreshNext(); return;
  }
  if (act==='pick'){
    const k = el.dataset.key, v = el.dataset.val, q = Q[k];
    if (q.type==='multi'){
      if (A[k].includes(v)) A[k] = A[k].filter(x=>x!==v);
      else if (A[k].length < q.max) A[k] = [...A[k], v];
      else { document.getElementById('hint').textContent = `${q.label}은 ${q.max}개까지`; return; }
      el.parentElement.querySelectorAll('.row').forEach(b=>b.setAttribute('aria-pressed', A[k].includes(b.dataset.val)));
    } else {
      A[k] = v;
      el.parentElement.querySelectorAll('.row').forEach(b=>b.setAttribute('aria-pressed', b===el));
    }
    refreshNext(); return;
  }
  if (act==='split'){
    split = el.dataset.val;
    el.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b===el));
    document.getElementById('groups').innerHTML = groupsHTML(); return;
  }
  if (act==='like'){
    const place = el.dataset.place;
    const hint = document.getElementById('likeHint');
    if (!ME){ hint.textContent = '2차 설문 낸 폰에서 누를 수 있어요'; return; }
    const before = (DATA.likes[place]||[]).slice();
    const on = !before.includes(ME.nickname);
    DATA.likes[place] = on ? before.concat(ME.nickname) : before.filter(n=>n!==ME.nickname);
    el.closest('.place').outerHTML = placeRow(DATA.places.find(p=>p.name===place));
    try {
      if (demo) await new Promise(r=>setTimeout(r,150));
      else {
        const res = await fetch(CONFIG.SCRIPT_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
          body:JSON.stringify({type:'like', nickname:ME.nickname, place})});
        const j = await res.json();
        if (!j.ok) throw new Error(j.error||'실패');
        DATA.likes[place] = j.likes;
      }
    } catch(err){
      DATA.likes[place] = before;
      hint.textContent = '저장 실패. 다시 눌러줘';
    }
    const row = [...document.querySelectorAll('#places .like')].find(b=>b.dataset.place===place);
    if (row) row.closest('.place').outerHTML = placeRow(DATA.places.find(p=>p.name===place));
    return;
  }
});

document.addEventListener('input', e=>{
  if (e.target.id==='nick'){
    A.nickname = e.target.value;
  }
  if (e.target.id==='must') A.must = e.target.value;
  if (e.target.id==='cantEat') A.cantEat = e.target.value;
  refreshNext();
});

render();
</script>
</body>
</html>
